[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-decoy-secret-tripwire"
version = "1.0.0"
description = "Plant inert decoy credentials in agent-visible files and alert on first use (stdlib only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
agent-decoy-secret-tripwire = "agent_decoy_secret_tripwire:main"

[tool.setuptools]
py-modules = ["agent_decoy_secret_tripwire"]
